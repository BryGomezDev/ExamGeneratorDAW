<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resúmenes Interactivos — DAW</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ── Layout ──────────────────────────────────────── */
  header {
    background: var(--surface-container-low);
    color: var(--on-surface);
    padding: 0 20px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--outline-variant);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 1rem; font-weight: 600; }
  .btn-ghost {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--outline-variant);
    color: var(--secondary);
    border-radius: var(--radius);
    padding: 6px 14px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .btn-ghost:hover { background: var(--surface-container); color: var(--primary); }

  .container { max-width: 1180px; margin: 0 auto; padding: 32px 20px; }
  .section-title { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
  .section-subtitle { color: var(--outline); font-size: 0.92rem; margin-bottom: 28px; }

  /* ── Cards ───────────────────────────────────────── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--surface-container);
    border: 1.5px solid var(--outline-variant);
    border-radius: var(--radius);
    padding: 24px 20px;
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--primary-container);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transform: translateY(-2px);
    outline: none;
  }
  .card-icon { font-size: 2rem; }
  .card-title { font-size: 1.05rem; font-weight: 600; color: var(--on-surface); }
  .card-meta { font-size: 0.85rem; color: var(--outline); }

  /* ── Loading ──────────────────────────────────────── */
  .loading { display: flex; align-items: center; justify-content: center;
    padding: 60px 0; flex-direction: column; gap: 16px; color: var(--outline); }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--outline-variant);
    border-top-color: var(--primary-container); border-radius: 50%;
    animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error ────────────────────────────────────────── */
  .error-msg { color: var(--error); padding: 24px 0; }

/* ── Summary viewer layout ───────────────────────────── */
.summary-wrap {
  display: grid;
  grid-template-columns: 220px 1fr;
  max-width: 1180px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
.summary-nav {
  background: var(--surface-container-low);
  border-right: 1px solid var(--outline-variant);
  padding: 16px 0 24px;
  position: sticky;
  top: 64px;
  align-self: start;
  max-height: calc(100vh - 64px);
  overflow-y: auto;
}
.nav-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--outline);
  padding: 0 20px 10px;
}
.nav-sep {
  height: 1px;
  background: var(--outline-variant);
  margin: 8px 12px;
}
.nav-badge {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--primary);
  flex-shrink: 0;
}
.nav-badge-quiz {
  background: var(--surface-container-high);
  color: var(--secondary);
  font-size: 0.7rem;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 20px;
  font-size: 0.875rem;
  color: var(--on-surface-variant);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.15s ease;
  background: none;
  border-right: none;
  border-top: none;
  border-bottom: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { color: var(--on-surface); background: var(--surface-container); }
.nav-item.active {
  color: var(--on-surface);
  border-left-color: var(--primary);
  background: var(--surface-variant);
}
.summary-main { padding: 40px 44px 60px; min-width: 0; }

/* ── Summary header ───────────────────────────────────── */
.summary-header { margin-bottom: 32px; }
.summary-kicker {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--secondary);
  text-transform: uppercase;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.summary-kicker::before { content: '●'; color: var(--primary); font-size: 0.6rem; }
.summary-unit { font-size: 2.5rem; font-weight: 600; color: var(--on-surface); line-height: 1.1; margin-bottom: 6px; letter-spacing: -0.025em; }
.summary-title { font-size: 1.05rem; font-weight: 500; color: var(--on-surface-variant); line-height: 1.4; }
.summary-intro { color: var(--on-surface-variant); margin-top: 14px; line-height: 1.65; }

/* ── Objectives ──────────────────────────────────────── */
.objectives-section { margin-top: 20px; margin-bottom: 28px; }
.objectives-kicker {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--outline);
  margin-bottom: 12px;
}
.objectives-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.obj-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 14px;
  background: var(--surface-container);
  border-radius: var(--radius);
}
.obj-num {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--primary);
  background: rgba(74, 66, 115, 0.6);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.obj-text { font-size: 0.88rem; color: var(--on-surface-variant); line-height: 1.5; }

/* ── Section footer / next button ────────────────────── */
.section-footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--outline-variant); }
.btn-next {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--surface-container);
  border-radius: var(--radius);
  border: none;
  cursor: pointer;
  transition: background 0.15s;
  text-align: left;
}
.btn-next:hover { background: var(--surface-container-high); }
.btn-next-label { font-size: 0.75rem; color: var(--on-surface-variant); }
.btn-next-section { font-size: 0.9rem; font-weight: 600; color: var(--primary); }
.btn-next-arrow { color: var(--primary); font-size: 1.1rem; }

/* ── Block hint ───────────────────────────────────────── */
.block-hint { font-size: 0.82rem; color: var(--outline); margin-bottom: 10px; font-style: italic; }

/* ── Blocks ──────────────────────────────────────────── */
.block + .block { margin-top: 24px; }

/* text */
.block-text { color: var(--on-surface-variant); line-height: 1.65; max-width: 75ch; }

/* cards */
.block-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.block-card { background: var(--surface-variant); border: 1px solid var(--outline-variant); border-radius: var(--radius); padding: 16px; }
.block-card .kicker { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; }
.block-card .card-h { font-weight: 600; color: var(--on-surface); margin: 4px 0 6px; }
.block-card .card-d { font-size: 0.88rem; color: var(--on-surface-variant); }
.block-card .card-ex { font-family: var(--font-mono); font-size: 0.8rem; color: var(--on-surface-variant); margin-top: 6px; background: var(--surface-container-lowest); padding: 6px 10px; border-radius: calc(var(--radius) / 2); }

/* accordion */
.accordion-wrap { background: var(--surface-container); border-radius: var(--radius); overflow: hidden; }
.accordion-row { border: none; border-radius: 0; margin-bottom: 0; }
.accordion-row + .accordion-row { border-top: 1px solid var(--surface-container-highest); }
.accordion-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; cursor: pointer; font-weight: 500; color: var(--on-surface);
  background: none; border: none; width: 100%; text-align: left;
}
.accordion-header:hover { background: var(--surface-container-high); }
.toggle-icon { color: var(--primary); font-size: 1.1rem; font-weight: 400; }
.accordion-body { padding: 12px 16px; color: var(--on-surface-variant); line-height: 1.6; border-top: 1px solid var(--surface-container-highest); background: var(--surface-container-low); }

/* timeline */
.timeline { padding-left: 20px; border-left: 2px solid var(--outline-variant); }
.timeline-item { position: relative; padding: 0 0 20px 20px; }
.timeline-item::before {
  content: ''; position: absolute; left: -7px; top: 4px;
  width: 12px; height: 12px;
  background: var(--primary-container);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(201, 190, 255, 0.12);
}
.timeline-year { font-size: 0.78rem; font-weight: 700; color: var(--primary); }
.timeline-label { font-weight: 600; color: var(--on-surface); }
.timeline-detail { font-size: 0.88rem; color: var(--on-surface-variant); margin-top: 2px; }

/* flipcards */
.flipcards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; align-items: stretch; }
.flipcard { perspective: 1000px; cursor: pointer; }
.flipcard-inner {
  display: grid;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  transition: transform 0.5s;
}
.flipcard-inner.is-flipped { transform: rotateY(180deg); }
.flipcard-front,
.flipcard-back {
  grid-area: 1 / 1;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 18px; text-align: center;
  height: 100%;
}
.flipcard-front { background: var(--surface-container); color: var(--on-surface); box-shadow: 0 0 0 1px var(--outline-variant); }
.flipcard-back { transform: rotateY(180deg); background: var(--surface-container-high); color: var(--on-surface-variant); font-size: 0.88rem; line-height: 1.5; box-shadow: 0 0 0 1px var(--outline-variant); }
.fc-term { font-size: 1rem; font-weight: 600; }
.fc-hint { font-size: 0.72rem; margin-top: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--primary); }
.fc-hint-back { font-size: 0.65rem; margin-top: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--outline); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface-container-high); color: var(--on-surface-variant); border-radius: 99px; padding: 5px 14px; font-size: 0.83rem; font-weight: 500; }

/* table */
.block-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.block-table th { background: var(--surface-container); color: var(--primary); font-family: var(--font-mono); font-size: 0.82rem; padding: 10px 14px; text-align: left; font-weight: 500; border-bottom: 1px solid var(--outline-variant); }
.block-table td { padding: 10px 14px; color: var(--on-surface-variant); border-bottom: 1px solid var(--outline-variant); }
.block-table td:first-child { color: var(--on-surface); font-weight: 600; }
.block-table tr:last-child td { border-bottom: none; }
.table-wrap { overflow-x: auto; border: 1px solid var(--outline-variant); border-radius: var(--radius); }

/* code */
.code-block { background: var(--surface-container-lowest); border-radius: var(--radius); padding: 16px; overflow-x: auto; }
.code-block pre { margin: 0; }
.code-block code { font-family: var(--font-mono); font-size: 0.875rem; color: var(--secondary); }

/* section heading */
.section-h { font-size: 1.15rem; font-weight: 700; color: var(--on-surface); margin-bottom: 16px; }

/* glossary */
.glossary-search-wrap { margin-bottom: 16px; }
.glossary-search {
  width: 100%; background: var(--surface-container-low); border: 1px solid var(--outline-variant);
  border-radius: var(--radius); padding: 10px 14px; color: var(--on-surface);
  font-size: 0.9rem;
}
.glossary-search::placeholder { color: var(--outline); }
.glossary-search:focus { border-color: var(--primary); outline: none; }
.glossary-list-wrap { background: var(--surface-container); border-radius: var(--radius); overflow: hidden; }
.glossary-item { padding: 12px 16px; border-bottom: 1px solid var(--outline-variant); }
.glossary-item:last-child { border-bottom: none; }
.glossary-term { font-weight: 600; color: var(--primary); }
.glossary-def { color: var(--on-surface-variant); font-size: 0.9rem; margin-top: 3px; }

/* quiz */
.quiz-score-card { background: var(--surface-container); border-radius: var(--radius); padding: 24px 28px; margin-bottom: 24px; }
.quiz-score-display { font-size: 3rem; font-weight: 600; color: var(--on-surface); line-height: 1; margin-bottom: 12px; }
.quiz-pills { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.pill-correct { background: var(--success-bg); color: var(--success); padding: 4px 12px; border-radius: 99px; font-size: 0.83rem; font-weight: 500; }
.pill-wrong { background: var(--error-bg); color: var(--error); padding: 4px 12px; border-radius: 99px; font-size: 0.83rem; font-weight: 500; }
.quiz-progress-bar { height: 6px; background: var(--surface-container-high); border-radius: 99px; overflow: hidden; display: flex; }
.quiz-progress-correct { background: var(--success); height: 100%; transition: width 0.3s; }
.quiz-progress-wrong { background: var(--error); height: 100%; transition: width 0.3s; }

.quiz-item { margin-bottom: 28px; }
.quiz-q { font-weight: 600; color: var(--on-surface); margin-bottom: 10px; }
.quiz-option {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius); margin-bottom: 6px;
  border: 1.5px solid var(--outline-variant); background: var(--surface-container);
  cursor: pointer; font-size: 0.9rem; color: var(--on-surface-variant);
  transition: border-color 0.15s, background 0.15s;
}
.quiz-option:hover:not(.submitted) { border-color: var(--primary-container); background: var(--surface-container-high); }
.quiz-option.submitted:not(.correct):not(.wrong) { opacity: 0.6; }
.quiz-option.selected { border-color: var(--primary-container); background: var(--surface-container-high); color: var(--on-surface); }
.quiz-option.correct  { border-color: var(--success); background: var(--success-bg); color: var(--on-surface); }
.quiz-option.wrong    { border-color: var(--error);   background: var(--error-bg);   color: var(--on-surface); }
.quiz-badge { font-size: 0.78rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
.quiz-badge.correct-badge { background: var(--success-bg); color: var(--success); }
.quiz-badge.wrong-badge   { background: var(--error-bg);   color: var(--error); }
.quiz-explanation { font-size: 0.85rem; color: var(--outline); margin-top: 6px; padding-left: 4px; }
.quiz-footer { display: flex; align-items: center; gap: 16px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--outline-variant); }
.btn-primary {
  background: var(--primary-container); color: var(--background); border: none; border-radius: var(--radius);
  padding: 10px 20px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--primary); color: var(--background); }
.btn-secondary {
  background: var(--surface-container); color: var(--on-surface-variant); border: 1px solid var(--outline-variant);
  border-radius: var(--radius); padding: 10px 20px; font-weight: 600; cursor: pointer;
  font-size: 0.9rem; transition: border-color 0.15s;
}
.btn-secondary:hover { border-color: var(--primary-container); color: var(--on-surface); }

/* back button */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--secondary); font-size: 0.88rem; cursor: pointer;
  background: none; border: none; margin-bottom: 16px; padding: 0;
}
.back-btn:hover { color: var(--primary); }

/* mobile */
@media (max-width: 640px) {
  .summary-wrap { grid-template-columns: 1fr; }
  .summary-nav {
    position: static; display: flex; overflow-x: auto;
    border-right: none; border-bottom: 1px solid var(--outline-variant);
    padding: 8px 0; max-height: none;
  }
  .nav-label { display: none; }
  .nav-sep { display: none; }
  .nav-item { white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; flex-shrink: 0; }
  .nav-item.active { border-bottom-color: var(--primary); border-left-color: transparent; background: transparent; }
  .summary-main { padding: 20px 16px 40px; }
  .objectives-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Resúmenes Interactivos</h1>
  <a href="index.html" class="btn-ghost">← Volver</a>
</header>
<div id="app">
  <div class="loading"><div class="spinner"></div><span>Cargando…</span></div>
</div>
<script>
'use strict';

const SUBJECT_NAMES = {
  si: 'Sistemas Informáticos', ed: 'Entornos de Desarrollo',
  bd: 'Bases de Datos', prog: 'Programación', lm: 'Lenguajes de Marcas',
  ip: 'Inglés Profesional', ipe: 'Itinerario Profesional para la Empleabilidad',
  dwec: 'Desarrollo Web en Entorno Cliente', dwes: 'Desarrollo Web en Entorno Servidor',
};
const SUBJECT_ICONS = {
  si: '🖥️', ed: '🛠️', bd: '🗄️', prog: '💻', lm: '📄',
  dwec: '🌐', dwes: '⚙️', ip: '🇬🇧', ipe: '💼',
};
function subjectName(code) { return SUBJECT_NAMES[code] || code.toUpperCase(); }
function subjectIcon(code) { return SUBJECT_ICONS[code] || '📚'; }

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const state = {
  screen:    'subjects',
  subjects:  [],
  subject:   null,
  unitNum:   null,
  summary:   null,
  section:   'intro',
  open:      {},
  flipped:   {},
  search:    '',
  answers:   {},
  submitted: false,
};

function render() {
  document.getElementById('app').innerHTML =
    state.screen === 'subjects' ? renderSubjects() :
    state.screen === 'units'    ? renderUnits()    :
                                  renderSummary();
  const hdr = document.querySelector('header');
  if (hdr) hdr.style.display = state.screen === 'summary' ? 'none' : '';
  const wrap = document.querySelector('.summary-wrap');
  if (wrap) wrap.style.minHeight = state.screen === 'summary' ? '100vh' : 'calc(100vh - 64px)';
  const nav = document.querySelector('.summary-nav');
  if (nav) { nav.style.top = '0'; nav.style.maxHeight = '100vh'; }
  bindEvents();
}

function renderSubjects() {
  const withSummaries = state.subjects.filter(s => s.summaryUnits && s.summaryUnits.length > 0);
  if (withSummaries.length === 0) {
    return `<div class="container"><p class="error-msg">No hay resúmenes disponibles aún.</p></div>`;
  }
  const cards = withSummaries.map(s => `
    <div class="card" data-action="select-subject" data-subject="${esc(s.name)}"
         tabindex="0" role="button" aria-label="${esc(subjectName(s.name))}">
      <div class="card-icon">${esc(subjectIcon(s.name))}</div>
      <div class="card-title">${esc(subjectName(s.name))}</div>
      <div class="card-meta">${s.summaryUnits.length} unidad${s.summaryUnits.length !== 1 ? 'es' : ''}</div>
    </div>
  `).join('');
  return `
    <div class="container">
      <div class="section-title">Resúmenes por asignatura</div>
      <div class="section-subtitle">Selecciona una asignatura para ver sus resúmenes</div>
      <div class="cards-grid">${cards}</div>
    </div>
  `;
}

function renderUnits() {
  const s = state.subject;
  const cards = s.summaryUnits.map(u => {
    const num = u.slice(1);
    return `
      <div class="card" data-action="select-unit" data-unit="${esc(num)}"
           tabindex="0" role="button" aria-label="Unidad ${esc(num)}">
        <div class="card-icon">📄</div>
        <div class="card-title">Unidad ${esc(num)}</div>
        <div class="card-meta">${esc(subjectName(s.name))}</div>
      </div>
    `;
  }).join('');
  return `
    <div class="container">
      <div style="margin-bottom:16px">
        <button class="btn-ghost" data-action="back-subjects" style="margin-left:0">← Asignaturas</button>
      </div>
      <div class="section-title">${esc(subjectName(s.name))}</div>
      <div class="section-subtitle">Selecciona una unidad</div>
      <div class="cards-grid">${cards}</div>
    </div>
  `;
}

function renderSummary() {
  if (!state.summary) {
    return `
      <div class="summary-wrap">
        <nav class="summary-nav">
          <button class="back-btn" data-action="back-units" style="padding:10px 20px;display:block">← Unidades</button>
        </nav>
        <main class="summary-main" id="summary-main" aria-live="polite">
          <div class="loading"><div class="spinner"></div><span>Cargando…</span></div>
        </main>
      </div>`;
  }
  const d = state.summary;
  const glossaryCount = d.glossary ? d.glossary.length : 0;

  const contentNavItems = [
    { id: 'intro', label: 'Introducción' },
    ...d.sections.map(s => ({ id: s.id, label: s.label })),
  ];
  const contentNavHtml = contentNavItems.map(n => `
    <button class="nav-item${state.section === n.id ? ' active' : ''}"
      ${state.section === n.id ? 'aria-current="page"' : ''}
      data-action="nav-section" data-section="${esc(n.id)}">${esc(n.label)}</button>
  `).join('');

  const navHtml = `
    <div class="nav-label">Contenido de la unidad</div>
    ${contentNavHtml}
    <div class="nav-sep"></div>
    <button class="nav-item${state.section === 'glossary' ? ' active' : ''}"
      ${state.section === 'glossary' ? 'aria-current="page"' : ''}
      data-action="nav-section" data-section="glossary">
      Glosario <span class="nav-badge">${glossaryCount}</span>
    </button>
    <button class="nav-item${state.section === 'quiz' ? ' active' : ''}"
      ${state.section === 'quiz' ? 'aria-current="page"' : ''}
      data-action="nav-section" data-section="quiz">
      Autoevaluación <span class="nav-badge-quiz">Quiz</span>
    </button>
  `;

  return `
    <div class="summary-wrap">
      <nav class="summary-nav">
        <button class="back-btn" data-action="back-units" style="padding:10px 20px 8px;display:block">← Unidades</button>
        ${navHtml}
      </nav>
      <main class="summary-main" id="summary-main" aria-live="polite">
        ${renderActiveSection()}
      </main>
    </div>`;
}

function bindEvents() {
  const app = document.getElementById('app');
  app.onclick = handleClick;
  app.onkeydown = e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (e.target.closest('button, a')) return;
    e.preventDefault();
    handleClick(e);
  };
  const searchEl = document.getElementById('glossary-search');
  if (searchEl) {
    searchEl.oninput = e => {
      state.search = e.target.value;
      const list = document.getElementById('glossary-list');
      if (list) list.innerHTML = renderGlossaryItems();
    };
  }
}

function handleClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'select-subject') {
    const subj = state.subjects.find(s => s.name === el.dataset.subject);
    if (!subj) return;
    state.subject = subj;
    state.screen = 'units';
    render();
  } else if (action === 'back-subjects') {
    state.screen = 'subjects';
    state.subject = null;
    render();
  } else if (action === 'select-unit') {
    const num = parseInt(el.dataset.unit, 10);
    state.unitNum = num;
    state.screen = 'summary';
    state.section = 'intro';
    state.open = {}; state.flipped = {};
    state.search = ''; state.answers = {}; state.submitted = false;
    render();
    loadSummary(state.subject.name, num);
  } else if (action === 'nav-section') {
    state.section = el.dataset.section;
    document.getElementById('summary-main').innerHTML = renderActiveSection();
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.section === state.section);
      if (btn.dataset.section === state.section) {
        btn.setAttribute('aria-current', 'page');
      } else {
        btn.removeAttribute('aria-current');
      }
    });
    window.scrollTo({ top: 0, behavior: 'instant' });
    bindEvents();
  } else if (action === 'toggle-open') {
    const key = el.dataset.key;
    state.open[key] = !state.open[key];
    const body = document.getElementById(`body-${key}`);
    if (body) { body.hidden = !state.open[key]; }
    const icon = el.querySelector('.toggle-icon');
    if (icon) icon.textContent = state.open[key] ? '−' : '+';
    el.setAttribute('aria-expanded', state.open[key] ? 'true' : 'false');
  } else if (action === 'flip') {
    const key = el.dataset.key;
    state.flipped[key] = !state.flipped[key];
    const inner = document.getElementById(`flip-inner-${key}`);
    if (inner) inner.classList.toggle('is-flipped', state.flipped[key]);
  } else if (action === 'select-answer') {
    if (state.submitted) return;
    const qi = parseInt(el.dataset.qi, 10), oi = parseInt(el.dataset.oi, 10);
    state.answers[qi] = oi;
    const section = document.getElementById('quiz-section');
    if (section) section.innerHTML = renderQuizSection();
    bindEvents();
  } else if (action === 'submit-quiz') {
    state.submitted = true;
    const section = document.getElementById('quiz-section');
    if (section) section.innerHTML = renderQuizSection();
    bindEvents();
  } else if (action === 'retry-quiz') {
    state.answers = {}; state.submitted = false;
    const section = document.getElementById('quiz-section');
    if (section) section.innerHTML = renderQuizSection();
    bindEvents();
  } else if (action === 'back-units') {
    state.screen = 'units'; state.summary = null;
    render();
  }
}

async function loadSummary(subject, unitNum) {
  try {
    const r = await fetch(`/api/summary/${subject}/${unitNum}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    state.summary = await r.json();
    render();
  } catch (err) {
    const main = document.getElementById('summary-main');
    if (main) main.innerHTML = `<p class="error-msg">Error cargando resumen: ${esc(err.message)}</p>`;
  }
}

function renderGlossaryItems() {
  const q = state.search.toLowerCase().trim();
  const items = q
    ? state.summary.glossary.filter(g =>
        g.term.toLowerCase().includes(q) || g.def.toLowerCase().includes(q))
    : state.summary.glossary;
  if (items.length === 0) return `<p style="padding:12px 16px;color:var(--outline)">Sin resultados.</p>`;
  return items.map(g => `
    <div class="glossary-item">
      <div class="glossary-term">${esc(g.term)}</div>
      <div class="glossary-def">${esc(g.def)}</div>
    </div>`).join('');
}

function renderNextButton(d, currentSectionId) {
  const allSections = ['intro', ...d.sections.map(s => s.id), 'glossary', 'quiz'];
  const currentIdx = allSections.indexOf(currentSectionId);
  if (currentIdx < 0 || currentIdx >= allSections.length - 1) return '';
  const nextId = allSections[currentIdx + 1];
  let nextLabel;
  if (nextId === 'glossary') nextLabel = 'Glosario';
  else if (nextId === 'quiz') nextLabel = 'Autoevaluación';
  else {
    const nextSec = d.sections.find(s => s.id === nextId);
    nextLabel = nextSec ? nextSec.label : nextId;
  }
  return `
    <div class="section-footer">
      <button class="btn-next" data-action="nav-section" data-section="${esc(nextId)}">
        <div>
          <div class="btn-next-label">Siguiente</div>
          <div class="btn-next-section">${esc(nextLabel)}</div>
        </div>
        <span class="btn-next-arrow">→</span>
      </button>
    </div>`;
}

function renderActiveSection() {
  const d = state.summary;
  if (!d) return '';

  if (state.section === 'intro') {
    const objHtml = d.objectives.length ? `
      <div class="objectives-section">
        <div class="objectives-kicker">Objetivos</div>
        <div class="objectives-grid">
          ${d.objectives.map((o, i) => `
            <div class="obj-item">
              <span class="obj-num">${String(i + 1).padStart(2, '0')}</span>
              <span class="obj-text">${esc(o)}</span>
            </div>`).join('')}
        </div>
      </div>` : '';
    return `
      <div class="summary-header">
        <div class="summary-kicker">${esc((SUBJECT_NAMES[d.subject] || d.subject).toUpperCase())}</div>
        <div class="summary-unit">Unidad ${esc(String(d.unit))}</div>
        <div class="summary-title">${esc(d.title)}</div>
        <p class="summary-intro">${esc(d.intro)}</p>
      </div>
      ${objHtml}
      ${renderNextButton(d, 'intro')}`;
  }

  if (state.section === 'glossary') {
    return `
      <h2 class="section-h">Glosario</h2>
      <div class="glossary-search-wrap">
        <input type="search" id="glossary-search" class="glossary-search"
          placeholder="Buscar término…" value="${esc(state.search)}" autocomplete="off"
          aria-label="Buscar en el glosario">
      </div>
      <div class="glossary-list-wrap">
        <div id="glossary-list">${renderGlossaryItems()}</div>
      </div>
      ${renderNextButton(d, 'glossary')}`;
  }

  if (state.section === 'quiz') {
    return `<div id="quiz-section">${renderQuizSection()}</div>`;
  }

  const sec = state.summary.sections.find(s => s.id === state.section);
  if (!sec) return '<p class="error-msg">Sección no encontrada.</p>';
  const blocks = sec.blocks.map((b, i) =>
    `<div class="block">${renderBlock(b, sec.id, i)}</div>`
  ).join('');
  return `<h2 class="section-h">${esc(sec.label)}</h2>${blocks}${renderNextButton(d, state.section)}`;
}

function renderQuizSection() {
  const d = state.summary;
  const items = d.quiz.map((q, qi) => {
    const badge = state.submitted
      ? (state.answers[qi] === q.correct
          ? `<div class="quiz-badge correct-badge">✓ Acertada</div>`
          : `<div class="quiz-badge wrong-badge">✗ Fallida</div>`)
      : '';
    const opts = q.options.map((opt, oi) => {
      let cls = 'quiz-option';
      if (state.submitted) {
        if (oi === q.correct) cls += ' correct';
        else if (oi === state.answers[qi]) cls += ' wrong';
        cls += ' submitted';
      } else if (state.answers[qi] === oi) {
        cls += ' selected';
      }
      const clickAttr = state.submitted
        ? ''
        : `data-action="select-answer" data-qi="${qi}" data-oi="${oi}" tabindex="0" role="button"`;
      return `<div class="${cls}" ${clickAttr}>${esc(opt)}</div>`;
    }).join('');
    const expl = state.submitted && q.explanation
      ? `<div class="quiz-explanation">${esc(q.explanation)}</div>` : '';
    return `
      <div class="quiz-item">
        ${badge}
        <div class="quiz-q">${qi + 1}. ${esc(q.question)}</div>
        ${opts}
        ${expl}
      </div>`;
  }).join('');

  let footer = '';
  if (state.submitted) {
    const correct = d.quiz.filter((q, qi) => state.answers[qi] === q.correct).length;
    const wrong = d.quiz.filter((q, qi) => state.answers[qi] !== undefined && state.answers[qi] !== q.correct).length;
    const correctPct = d.quiz.length > 0 ? Math.round(correct / d.quiz.length * 100) : 0;
    const wrongPct = d.quiz.length > 0 ? Math.round(wrong / d.quiz.length * 100) : 0;
    const testLink = state.subject && state.unitNum !== null
      ? `<a href="index.html?subject=${esc(state.subject.name)}&unit=${esc(String(state.unitNum))}"
           class="btn-primary" style="text-decoration:none">Hacer el test →</a>`
      : '';
    footer = `
      <div class="quiz-score-card">
        <div class="quiz-score-display">${correct}<span style="font-size:1.5rem;color:var(--on-surface-variant)"> / ${d.quiz.length}</span></div>
        <div class="quiz-pills">
          <span class="pill-correct">✓ ${correct} correctas</span>
          <span class="pill-wrong">✗ ${wrong} incorrectas</span>
        </div>
        <div class="quiz-progress-bar">
          <div class="quiz-progress-correct" style="width:${correctPct}%"></div>
          <div class="quiz-progress-wrong" style="width:${wrongPct}%"></div>
        </div>
      </div>
      <div class="quiz-footer">
        <button class="btn-secondary" data-action="retry-quiz">Reintentar</button>
        ${testLink}
      </div>`;
  } else {
    const answered = Object.keys(state.answers).length;
    footer = `
      <div class="quiz-footer">
        <span style="color:var(--outline);font-size:0.88rem">${answered} / ${d.quiz.length} respondidas</span>
        <button class="btn-primary" data-action="submit-quiz"
          ${answered === 0 ? 'disabled' : ''}>Comprobar respuestas</button>
      </div>`;
  }
  return `<h2 class="section-h">Quiz de autoevaluación</h2>${items}${footer}`;
}

function renderBlock(block, sectionId, blockIdx) {
  switch (block.type) {
    case 'text':
      return `<p class="block-text">${esc(block.content)}</p>`;

    case 'cards':
      return `<div class="block-cards">${block.items.map(item => `
        <div class="block-card">
          ${item.kicker ? `<div class="kicker">${esc(item.kicker)}</div>` : ''}
          <div class="card-h">${esc(item.title)}</div>
          ${item.desc ? `<div class="card-d">${esc(item.desc)}</div>` : ''}
          ${item.example ? `<div class="card-ex">Ej: ${esc(item.example)}</div>` : ''}
        </div>`).join('')}</div>`;

    case 'accordion':
      return `<div class="accordion-wrap">${block.items.map((item, i) => {
        const key = `${sectionId}-${blockIdx}-${i}`;
        return `
          <div class="accordion-row">
            <button class="accordion-header" data-action="toggle-open" data-key="${esc(key)}"
              aria-expanded="${state.open[key] ? 'true' : 'false'}">
              <span>${esc(item.title)}</span>
              <span class="toggle-icon">${state.open[key] ? '−' : '+'}</span>
            </button>
            <div class="accordion-body" id="body-${esc(key)}" ${state.open[key] ? '' : 'hidden'}>
              ${esc(item.content)}
            </div>
          </div>`;
      }).join('')}</div>`;

    case 'timeline':
      return `<p class="block-hint">Línea cronológica de evolución.</p>
      <div class="timeline">${block.items.map(item => `
        <div class="timeline-item">
          <div class="timeline-year">${esc(item.year)}</div>
          <div class="timeline-label">${esc(item.label)}</div>
          ${item.detail ? `<div class="timeline-detail">${esc(item.detail)}</div>` : ''}
        </div>`).join('')}</div>`;

    case 'flipcards':
      return `<p class="block-hint">Clic en cada tarjeta para ver la definición.</p>
      <div class="flipcards-grid">${block.items.map((item, i) => {
        const key = `${sectionId}-${blockIdx}-${i}`;
        return `
          <div class="flipcard" data-action="flip" data-key="${esc(key)}"
               tabindex="0" role="button" aria-label="Voltear: ${esc(item.term)}">
            <div class="flipcard-inner" id="flip-inner-${esc(key)}">
              <div class="flipcard-front">
                <span class="fc-term">${esc(item.term)}</span>
                <span class="fc-hint">Clic para ver definición</span>
              </div>
              <div class="flipcard-back">
                ${esc(item.def)}
                <span class="fc-hint-back" aria-hidden="true">Clic para ocultar</span>
              </div>
            </div>
          </div>`;
      }).join('')}</div>`;

    case 'chips':
      return `<div class="chips">${block.items.map(c =>
        `<span class="chip">${esc(c)}</span>`).join('')}</div>`;

    case 'table':
      return `<div class="table-wrap"><table class="block-table">
        <thead><tr>${block.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${block.rows.map(row =>
          `<tr>${row.map(cell => `<td>${esc(cell)}</td>`).join('')}</tr>`
        ).join('')}</tbody>
      </table></div>`;

    case 'code':
      return `<div class="code-block"><pre><code>${esc(block.content)}</code></pre></div>`;

    default:
      return `<p class="error-msg">Bloque desconocido: ${esc(block.type)}</p>`;
  }
}

// ── Init ──────────────────────────────────────────────────────────────
(async () => {
  try {
    const r = await fetch('/api/subjects');
    if (!r.ok) throw new Error('Error cargando asignaturas');
    state.subjects = await r.json();
    render();
  } catch (err) {
    document.getElementById('app').innerHTML =
      `<div class="container"><p class="error-msg">Error: ${esc(err.message)}</p></div>`;
  }
})();
</script>
</body>
